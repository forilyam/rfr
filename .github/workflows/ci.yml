name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Backend build and e2e compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build backends and compile e2e
        run: ./gradlew :rfr-auth:build :rfr-api:build :rfr-e2e:testClasses

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rfr-gql-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
